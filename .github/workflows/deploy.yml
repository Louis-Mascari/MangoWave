name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-backend:
    # Only deploy if CI succeeded and was triggered by a push (not a PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      s3-bucket: ${{ steps.cdk-outputs.outputs.bucket }}
      distribution-id: ${{ steps.cdk-outputs.outputs.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        run: >-
          pnpm exec cdk deploy --require-approval never
          -c alertEmail=${{ secrets.ALERT_EMAIL }}
          -c acmCertArn=${{ secrets.ACM_CERT_ARN }}
          -c webAclArn=${{ secrets.WEB_ACL_ARN }}
        working-directory: infrastructure

      - name: Read CDK outputs
        id: cdk-outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name MangoWaveStack --query 'Stacks[0].Outputs')
          echo "bucket=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distro=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @mangowave/frontend run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ secrets.VITE_SPOTIFY_REDIRECT_URI }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_LOCKED_MODE: ${{ secrets.VITE_LOCKED_MODE }}
          VITE_UNLOCK_HASH: ${{ secrets.VITE_UNLOCK_HASH }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync app to S3
        run: |
          aws s3 sync packages/frontend/dist s3://${{ needs.deploy-backend.outputs.s3-bucket }} --delete --exclude 'landing/*'
          aws s3 cp packages/frontend/dist/index.html \
            s3://${{ needs.deploy-backend.outputs.s3-bucket }}/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Sync landing page to S3
        run: |
          aws s3 sync packages/landing s3://${{ needs.deploy-backend.outputs.s3-bucket }}/landing --delete
          aws s3 cp packages/landing/index.html \
            s3://${{ needs.deploy-backend.outputs.s3-bucket }}/landing/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-backend.outputs.distribution-id }} \
            --paths "/*"
