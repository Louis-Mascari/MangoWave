name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  guard:
    # Only deploy if CI succeeded and was triggered by a push (not a PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      # Re-running CI for an old commit fires this workflow with that commit's SHA.
      # Deploying it would roll production back, so only the tip of main may deploy.
      - name: Check the tested commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$TIP" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of $HEAD_SHA: main is now at $TIP"
          fi

  deploy-backend:
    needs: guard
    if: needs.guard.outputs.current == 'true'
    runs-on: ubuntu-latest
    outputs:
      s3-bucket: ${{ steps.cdk-outputs.outputs.bucket }}
      distribution-id: ${{ steps.cdk-outputs.outputs.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the commit CI tested, not whatever main points at by now
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        run: >-
          pnpm exec cdk deploy --require-approval never
          -c alertEmail=${{ secrets.ALERT_EMAIL }}
          -c acmCertArn=${{ secrets.ACM_CERT_ARN }}
          -c webAclArn=${{ secrets.WEB_ACL_ARN }}
        working-directory: infrastructure

      - name: Read CDK outputs
        id: cdk-outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name MangoWaveStack --query 'Stacks[0].Outputs')
          echo "bucket=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distro=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the commit CI tested, not whatever main points at by now
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @mangowave/frontend run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ secrets.VITE_SPOTIFY_REDIRECT_URI }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_LOCKED_MODE: ${{ secrets.VITE_LOCKED_MODE }}
          VITE_UNLOCK_HASH: ${{ secrets.VITE_UNLOCK_HASH }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync app to S3
        env:
          BUCKET: ${{ needs.deploy-backend.outputs.s3-bucket }}
        run: |
          # Hashed chunks go up first and are never deleted here: a tab opened
          # before this deploy still lazy-loads the previous build's chunks.
          # `cp` rather than `sync` so every current file is re-uploaded, which
          # resets its LastModified (the prune step below reads it as "last
          # deploy that shipped this file") and applies the Cache-Control header.
          aws s3 cp packages/frontend/dist/assets "s3://${BUCKET}/assets" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync packages/frontend/dist "s3://${BUCKET}" \
            --delete --exclude 'assets/*' --exclude 'landing/*'
          aws s3 cp packages/frontend/dist/index.html \
            "s3://${BUCKET}/index.html" \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Sync landing page to S3
        run: |
          aws s3 sync packages/landing s3://${{ needs.deploy-backend.outputs.s3-bucket }}/landing --delete
          aws s3 cp packages/landing/index.html \
            s3://${{ needs.deploy-backend.outputs.s3-bucket }}/landing/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-backend.outputs.distribution-id }} \
            --paths "/*"

      # Last, and never fatal: the new build is already live at this point.
      - name: Prune stale hashed assets
        env:
          BUCKET: ${{ needs.deploy-backend.outputs.s3-bucket }}
        run: |
          if ! bash .github/scripts/prune-stale-assets.sh "$BUCKET" packages/frontend/dist/assets 14; then
            echo "::warning title=Asset prune failed::Old files under assets/ were not pruned. The deploy itself succeeded; see this step's log."
          fi
